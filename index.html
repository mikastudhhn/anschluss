  if (cur) lines.push(cur);

const cdist = (a, b) => { const A = CITIES[a], B = CITIES[b]; return Math.hypot((A[0] - B[0]) * 0.63, A[1] - B[1]); };

    sel.sort((a, b) => a.t - b.t);
    const route = [start, ...sel.map(o => o.c), dest];
    let ok = true;
    for (let i = 0; i < route.length - 1; i++) if (cdist(route[i], route[i + 1]) < 0.35) ok = false;
    if (ok) return route;
  }
  const near = CN.filter(c => c !== start).sort((a, b) => cdist(start, a) - cdist(start, b));
  return [start, near[2], near[5], near[8]];
}
function legParams(k, type) {
  if (type === 'sev') {
    const v = Math.min(240 + 12 * k, 400), D = 2300 + 120 * k;
    return { v, D, T: Math.ceil((D / v) * Math.max(1.05, 1.13 - 0.012 * k)) };
  }
  const v = Math.min(250 + 14 * k, 430), D = 3000 + 240 * k;
  return { v, D, T: Math.ceil((D / v) * Math.max(1.06, 1.17 - 0.018 * k)) };
}
function makeJourney(start) {
  const route = makeRoute(start), n = route.length - 1;
  const plan = [];
  const startClock = ri(13 * 60, 16 * 60 + 30);
  let clock = startClock;
  for (let i = 0; i < n; i++) {
    const P = legParams(G.legNo + i, 'station');
    const ride = Math.round(12 + cdist(route[i], route[i + 1]) * 42);
    const dep = clock + P.T;
    plan.push({ v: P.v, D: P.D, T: P.T, dep, ride });
    clock = dep + ride;
  }
  const occ = pick(OCCASIONS);
  const termin = Math.ceil((clock + occ.buffer) / 15) * 15;
  return { route, n, plan, leg: 0, startClock, arrival: clock, termin, buffer: termin - clock, delay: 0, segs: [], occ, stars: 0 };
}

// ---------- level generation ----------
function mkObs(type, lanes, extra) {
  const o = Object.assign({ type, lanes, d: 0, hit: false, passed: false, t: rnd() * 10,
    x: (LANES[lanes[0]] + LANES[lanes[lanes.length - 1]]) / 2 }, extra || {});
  if (type === 'pigeons') {
    o.flee = rnd() < 0.4; o.fled = false; o.fly = 0;
    o.birds = [[-17, 3], [0, -5], [16, 4]].map(([dx, dy]) => ({ dx, dy, face: rnd() < 0.5 ? -1 : 1, fx: rr(-1.3, 1.3), ph: rr(0, 6) }));
  } else if (type === 'suitcase') {
    o.from = lanes[0]; o.mv = 0; o.color = pick(SUITC); o.hx = 0; o.hy = 0; o.rot = 0; o.vx = 0; o.vy = 0; o.vr = 0;
  } else if (type === 'group') {
    o.jostle = 0; o.rain = G.legType === 'sev';
    o.people = [-68, -34, 0, 34, 68].map((dx, i) => ({ dx: dx + rr(-5, 5), dy: rr(-9, 9), c: pick(JACKETS), hair: pick(HAIR),
      skin: pick(SKIN), cap: rnd() < 0.3, phone: i !== 2 && rnd() < 0.35, guide: i === 2 && !o.rain }));
    o.people.sort((a, b) => a.dy - b.dy);
  } else if (type === 'pillar') {
    o.poster = pick(POSTERS);
  } else if (type === 'barrier') {
    o.fall = 0; o.fdir = 1;
  } else if (type === 'scooter') {
    o.rot = rr(0.3, 0.6) * (rnd() < 0.5 ? 1 : -1); o.color = pick(['#9be15d', '#ff6b6b', '#5ad1ff']); o.spin = 0; o.vx = 0;
  } else if (type === 'puddle') {
    o.rx = rr(30, 38);
  } else if (type === 'taxi') {
    o.dir = rnd() < 0.5 ? 1 : -1; o.target = LANES[lanes[0]] + rr(-12, 12); o.started = false; o.S = 0;
    o.x = o.dir > 0 ? -80 : W + 80;
  }
  return o;
}

function generate(to) {
  const L = G.legNo + 1, g = G.gen, sev = G.legType === 'sev';
  for (;;) {
    const kind = sev
      ? weighted([['scooter', 3], ['puddle', 2.5], ['barrier', 1.4], ['group', 1.4], ['taxi', 1.2], ['double', 0.6 + 0.3 * L]])
      : weighted([['pillar', 3], ['barrier', 2], ['pigeons', 2.2], ['suitcase', L >= 2 ? 2 : 0],
        ['group', G.theme === 'nacht' ? 0.6 : 1.6], ['double', 0.6 + 0.35 * L]]);
    const singles = sev ? ['scooter', 'puddle', 'barrier', 'scooter'] : ['pillar', 'barrier', 'pigeons', 'pillar'];
    const row = [];
    let free;
    if (kind === 'group') {
      const a = ri(0, 1);
      row.push(mkObs('group', [a, a + 1]));
      free = [a === 0 ? 2 : 0];
    } else if (kind === 'double') {
      const f = ri(0, 2);
      free = [f];
      for (let l = 0; l < 3; l++) if (l !== f) row.push(mkObs(pick(singles), [l]));
    } else if (kind === 'suitcase') {
      const a = ri(0, 2), b = a === 1 ? pick([0, 2]) : 1;
      row.push(mkObs('suitcase', [a], { to: b }));
      free = [3 - a - b];
    } else {
      const a = ri(0, 2);
      row.push(mkObs(kind, [a]));
      free = [0, 1, 2].filter(l => l !== a);
    }
    let move = 2;
    for (const a of g.free) for (const b of free) move = Math.min(move, Math.abs(a - b));
    const gap = Math.max(175, 290 - 10 * L) + rr(-15, 45) + (move === 2 ? 60 : move === 1 ? 15 : 0);
    let d = g.d + gap;
    for (const [a, b] of G.noGen) if (d > a && d < b) { d = b + rr(20, 80); g.free = [0, 1, 2]; }
    if (d > to) break;
    for (const o of row) { o.d = d; G.obstacles.push(o); }
    g.since++;
    if (g.since >= 3 && rnd() < 0.25) {
      G.items.push({ type: 'coffee', d, x: LANES[pick(free)], t: rnd() * 10, taken: false });
      g.since = 0;
    }
    g.d = d; g.free = free;
  }
}

function setupForks(k) {
  const truth = ri(1, 22);
  let wrong;
  do { wrong = ri(1, 22); } while (wrong === truth);
  G.gleisTruth = truth;
  G.gleisFork = null;
  if (k === 1 || (k > 1 && rnd() < 0.65)) {
    const info = { tafel: rnd() < 0.5 ? truth : wrong, durchsage: rnd() < 0.85 ? truth : wrong, app: rnd() < 0.65 ? truth : wrong };
    G.info = info;
    const truthLeft = rnd() < 0.5;
    const len = 520, d0 = G.D - len;
    const a = truthLeft ? truth : wrong, b = truthLeft ? wrong : truth;
    const f = { kind: 'gleis', d0, len, chosen: null, done: false,
      sides: { L: { label: 'Gleis ' + a, gleis: a }, R: { label: 'Gleis ' + b, gleis: b } } };
    G.forks.push(f);
    G.gleisFork = f;
    G.noGen.push([d0 - 380, G.D + 10]);
    G.events.push({ at: G.D * rr(0.22, 0.3), fn: () => appNote(info.app) });
    G.events.push({ at: G.D * rr(0.48, 0.56), fn: () => durchsage(info.durchsage) });
    G.wrongDest = pick(FUNNY);
  } else {
    G.info = { tafel: truth };
  }
  if (k === 0 || rnd() < 0.6) {
    const kind = k === 0 ? 'bakery' : rnd() < 0.55 ? 'shortcut' : 'bakery';
    const len = 480, d0 = Math.round(G.D * rr(0.36, 0.46));
    const specialLeft = rnd() < 0.5;
    const special = kind === 'bakery'
      ? { label: 'Bäckerei ☕', dd: 260, color: '#8a5a1f' }
      : { label: 'Abkürzung', dd: -420, color: '#6a2a7a' };
    const main = { label: 'Gleise', dd: 0, color: '#0b2a6b' };
    const f = { kind, d0, len, chosen: null, done: false, sides: specialLeft ? { L: special, R: main } : { L: main, R: special } };
    G.forks.push(f);
    G.noGen.push([d0 - 380, d0 + len + 150]);
    const lane = specialLeft ? 0 : 2;
    if (kind === 'shortcut') {
      for (const dd of [170, 360]) {
        const o = mkObs('pigeons', [lane]);
        o.d = d0 + dd; o.flee = rnd() < 0.5;
        G.obstacles.push(o);
      }
    } else {
      G.items.push({ type: 'coffee', d: d0 + 230, x: LANES[lane], t: rnd() * 10, taken: false });
    }
  }
  G.forks.sort((a, b) => a.d0 - b.d0);
}

function startLeg(type) {
  const J = G.J, i = J.leg, k = G.legNo;
  const P = type === 'sev' ? legParams(k, 'sev') : J.plan[i];
  G.legType = type;
  if (type === 'sev') G.theme = 'sev';
  else if (k === 0) G.theme = 'abend';
  else { const prev = G.theme; do { G.theme = pick(['abend', 'nacht', 'regen', 'ubahn', 'dorf']); } while (G.theme === prev); }
  G.band = pick(BANDS);
  G.v = P.v; G.D = P.D; G.timeTotal = P.T; G.timeLeft = P.T; G.delay = 0; G.s = 0;
  G.obstacles = []; G.items = []; G.forks = []; G.noGen = []; G.events = []; G.lock = null;
  G.wrongSide = false; G.backtracked = false; G.gleisFork = null;
  G.combo = 0; G.comboT = 0; G.comboBonus = 0; G.fade = 0;
  const to = J.route[i + 1];
  const planned = clockStr(J.plan[i].dep + J.delay);
  if (type === 'sev') {
    G.train = { name: 'Bus SEV', badge: 'Bus', color: '#f08c00', dest: to, gleis: 'H', planned };
    G.info = { tafel: 'H' };
    G.events.push({ at: G.D * rr(0.12, 0.2), fn: () => banner('Der Bus fährt heute ausnahmsweise pünktlich.', null, null) });
    G.tip = 'Der Bus wartet nicht. Wirklich nicht.';
  } else {
    const tt = pick(TRAINS);
    G.train = { name: tt.t + ' ' + ri(tt.n[0], tt.n[1]), badge: null, color: tt.c, dest: to + ' Hbf', planned };
    setupForks(k);
    G.train.gleis = G.info.tafel;
    if (k === 0) G.events.push({ at: G.D * 0.14, fn: () => fireAnnouncement(ANN[4]) });
    else if (rnd() < 0.55) G.events.push({ at: G.D * rr(0.1, 0.18), fn: () => fireAnnouncement() });
    G.tip = k === 0 ? 'Gabelung: links oder rechts. In der Mitte steht eine Wand.'
      : k === 1 ? 'Tafel, Durchsage und App sind sich nicht immer einig.' : pick(TIPS);
  }
  G.events.sort((a, b) => a.at - b.at);
  G.gen = { d: 380, free: [0, 1, 2], since: 1 };
  generate(G.D - 430);
  const p = G.player;
  p.lane = 1; p.x = LANES[1]; p.stun = 0; p.boost = 0; p.slow = 0; p.board = 0; p.lean = 0; p.prevLane = 1; p.changeT = -9;
  G.trainX = 0; G.trainV = 0; G.doors = 1; G.sf = {};
  G.ann = null; G.annQ = []; G.app = null;
  G.flapT = 0; G.gleisFlapT = 0;
  G.mode = 'intro'; G.t = 0;
  rainSound(!!THEMES[G.theme].rain);
}

function newRun() {
  G.run = { stars: 0, journeys: 0 };
  G.legNo = 0; G.hits = 0; G.bestAtStart = best; G.newBest = false;
  G.city = pick(CN);
  G.particles = []; G.texts = [];
  newJourney();
}
function newJourney() {
  G.J = makeJourney(G.city);
  G.mode = 'jintro'; G.t = 0;
  rainSound(false);
}
function goMap(segMode) {
  G.J.segs.push(segMode);
  G.mode = 'map'; G.t = 0;
  rainSound(false);
}
function afterMap() {
  const J = G.J;
  J.leg++; G.legNo++;
  if (J.delay > J.buffer) return gameOver();
  if (J.leg >= J.n) return arrive();
  startLeg('station');
}
function arrive() {
  const J = G.J;
  const st = J.delay <= 0 ? 3 : J.delay <= Math.round(J.buffer / 3) ? 2 : 1;
  J.stars = st;
  G.run.stars += st; G.run.journeys++;
  if (G.run.stars > best) { best = G.run.stars; save('anschluss.stars', best); }
  G.newBest = G.run.stars > G.bestAtStart;
  G.city = J.route[J.n];
  G.mode = 'arrive'; G.t = 0; G.starsShown = 0;
  sfx.win();
}
function gameOver() {
  G.mode = 'over'; G.t = 0;
  rainSound(false);
  sfx.fail();
  if (G.newBest) burst('confetti', 180, 330, 80);
}

// ---------- events, info sources ----------
function popText(str, x, y, col, size) {
  G.texts.push({ str, x: clamp(x, 80, 280), y, col: col || '#fff', size: size || 22, t: 0, dur: 0.9 });
}
function banner(text, chip, col) { G.annQ.push({ text, chip, col, t: 0, dur: 3.8 }); }
function appNote(n) { G.app = { n, t: 0, dur: 3.8 }; sfx.ping(); }
function durchsage(n) {
  const same = n === G.info.tafel;
  banner(same
    ? `${G.train.name} nach ${G.train.dest}: heute wie angezeigt von Gleis ${n}.`
    : `Achtung! ${G.train.name} nach ${G.train.dest} fährt heute von Gleis ${n}.`,
  same ? null : 'Gleis ' + n, same ? null : '#f08c00');
}
function fireAnnouncement(forced) {
  // bad news only if a flawless run can still make it
  const buffer = G.timeLeft - (G.D - G.s) / G.v;
  const fair = ANN.filter(x => !(x.dt < 0) || buffer + x.dt >= 1.5);
  const a = forced || weighted(fair.map(x => [x, x.w]));
  let chip = null, col = null;
  if (a.dt) {
    G.timeLeft += a.dt;
    if (a.dt > 0) { G.delay += a.dt; G.J.delay += a.dt; chip = '+' + a.dt + ' Min'; col = '#1fae5b'; }
    else { chip = '−' + -a.dt + ' Min'; col = '#e5383b'; }
  }
  banner(a.t, chip, col);
}

// ---------- update ----------
function burst(type, x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = Math.random();
    const P = { type, x, y, vx: 0, vy: 0, t: 0, life: 1, rot: Math.random() * TAU, vr: 0, size: 3, color: '#fff', world: false };
    if (type === 'dust') {
      P.vx = Math.cos(a) * (40 + sp * 80); P.vy = Math.sin(a) * (20 + sp * 40) - 20; P.life = 0.5; P.size = 3 + sp * 4; P.world = true;
    } else if (type === 'feather') {
      P.vx = Math.cos(a) * (60 + sp * 90); P.vy = -60 - sp * 120; P.life = 1.3; P.vr = (Math.random() - 0.5) * 8; P.size = 4 + sp * 3; P.world = true;
    } else if (type === 'confetti') {
      P.vx = (Math.random() - 0.5) * 420; P.vy = -250 - sp * 380; P.life = 2.2; P.vr = (Math.random() - 0.5) * 14; P.size = 4 + sp * 4; P.color = vpick(CONF);
    } else if (type === 'spark') {
      P.vx = Math.cos(a) * (90 + sp * 120); P.vy = Math.sin(a) * (90 + sp * 120); P.life = 0.45; P.size = 2 + sp * 2;
    } else if (type === 'drop') {
      P.vx = (Math.random() - 0.5) * 160; P.vy = -120 - sp * 120; P.life = 0.55; P.size = 1.5 + sp * 2; P.world = true;
    }
    G.particles.push(P);
  }
}

function advance(v, dt) {
  const p = G.player;
  G.curV = v;
  G.s += v * dt;
  p.phase += dt * (7 + v * 0.03);
  for (const o of G.obstacles) updateObs(o, dt);
  G.obstacles = G.obstacles.filter(o => screenY(o.d) < H + 140);
  G.items = G.items.filter(it => !it.taken && screenY(it.d) < H + 60);
}

function updateObs(o, dt) {
  o.t += dt;
  const dist = o.d - G.s;
  if (o.type === 'pigeons') {
    if (o.flee && !o.fled && dist < 150 && G.mode === 'play') { o.fled = true; sfx.coo(); }
    if (o.fled) o.fly += dt;
  } else if (o.type === 'suitcase') {
    if (o.hit) {
      o.hx += o.vx * dt; o.hy += o.vy * dt; o.vy += 900 * dt; o.rot += o.vr * dt;
    } else if (dist < 380 && G.mode === 'play') {
      o.mv = Math.min(1, o.mv + dt / 0.85);
      o.x = lerp(LANES[o.from], LANES[o.to], ease(o.mv));
    }
  } else if (o.type === 'barrier') {
    if (o.hit) o.fall = Math.min(1, o.fall + dt * 5);
  } else if (o.type === 'group') {
    o.jostle = Math.max(0, o.jostle - dt * 1.5);
  } else if (o.type === 'scooter') {
    if (o.hit) { o.spin = Math.min(1.4, o.spin + dt * 6); o.x += o.vx * dt; o.vx *= 1 - dt * 3; }
  } else if (o.type === 'taxi') {
    if (!o.started && dist < 430 && G.mode === 'play') {
      o.started = true;
      o.S = Math.abs(o.target - o.x) / Math.max(0.4, dist / G.v);
      sfx.honk();
    }
    if (o.started) o.x += o.dir * o.S * dt;
  }
}

function resetCombo() { G.combo = 0; G.comboT = 0; }

function hit(o, oy) {
  const p = G.player;
  o.hit = true;
  resetCombo();
  if (o.type === 'puddle') {
    p.slow = 0.6;
    burst('drop', p.x, PLAYER_Y + 4, 14);
    popText('Platsch!', p.x, PLAYER_Y - 72, '#8fd3ff');
    sfx.splash();
    return;
  }
  G.hits++;
  p.stun = STUN; G.shake = 11; G.flash = 0.35;
  vibrate(45);
  sfx.hit();
  burst('dust', p.x, PLAYER_Y - 6, 10);
  const ty = PLAYER_Y - 72;
  switch (o.type) {
    case 'pillar': popText(pick(['Autsch!', 'Aua!', 'Säule?!']), p.x, ty); break;
    case 'barrier': o.fdir = p.x <= o.x ? 1 : -1; popText('Baustelle!', p.x, ty, '#ffd400'); break;
    case 'pigeons': o.fled = true; burst('feather', o.x, oy - 6, 16); popText('Gurr!!', p.x, ty); sfx.coo(); break;
    case 'suitcase':
      o.vx = (o.x <= p.x ? -1 : 1) * rr(220, 300); o.vy = -280; o.vr = rr(8, 12) * Math.sign(o.vx);
      popText(pick(['Mein Koffer!', 'Sorry!', 'Huch!']), p.x, ty);
      break;
    case 'group': o.jostle = 1; popText(pick(['Hey!', 'Drängeln!?', 'Excuse me!', 'Na hallo?']), p.x, ty); break;
    case 'scooter': o.vx = (o.x <= p.x ? -1 : 1) * 160; popText('E-Scooter?!', p.x, ty); break;
    case 'taxi': popText('Hup! Hup!', p.x, ty, '#ffd400'); sfx.honk(); break;
  }
}

function bumpWall() {
  const p = G.player;
  G.hits++;
  p.stun = STUN * 0.8; G.shake = 9; G.flash = 0.3;
  resetCombo();
  sfx.hit();
  burst('dust', p.x, PLAYER_Y - 6, 8);
  popText('Entscheide dich!', 180, PLAYER_Y - 80, '#ffd400', 20);
}

function nearMiss() {
  const p = G.player;
  G.combo = G.comboT > 0 ? G.combo + 1 : 1;
  G.comboT = 3;
  G.slowmo = 0.32;
  sfx.whoosh();
  popText(G.combo >= 2 ? `Knapp! x${G.combo}` : 'Knapp!', p.x, PLAYER_Y - 82, '#8fd3ff', 22);
  if (G.combo >= 3 && G.comboBonus < 4) {
    G.comboBonus++;
    G.timeLeft += 1;
    G.texts.push({ str: '+1 Min', x: clamp(p.x, 80, 280), y: PLAYER_Y - 56, col: '#3ddc97', size: 15, t: 0, dur: 0.9 });
  }
}

function collect(it, oy) {
  it.taken = true;
  G.player.boost = 2.6;
  popText('Koffein!', it.x, PLAYER_Y - 72, '#ffd27a');
  burst('spark', it.x, oy - 8, 14);
  sfx.coffee();
}

function updateForks() {
  const p = G.player;
  for (const f of G.forks) {
    if (!f.chosen && G.s >= f.d0) {
      if (p.lane === 1) {
        p.lane = p.x < 180 ? 0 : p.x > 180 ? 2 : (rnd() < 0.5 ? 0 : 2);
        bumpWall();
      }
      f.chosen = p.lane === 0 ? 'L' : 'R';
      G.lock = p.lane;
      if (f.kind === 'gleis') G.wrongSide = f.sides[f.chosen].gleis !== G.gleisTruth;
    }
    if (f.chosen && !f.done && G.s >= f.d0 + f.len) {
      f.done = true;
      G.lock = null;
      const side = f.sides[f.chosen];
      // shorter or longer path, expressed as time so the track geometry stays fixed
      if (side.dd) {
        const gain = -side.dd / G.v;
        G.timeLeft += gain;
        popText(gain > 0 ? `Abkürzung! +${Math.max(1, Math.round(gain))} Min` : `Umweg −${Math.max(1, Math.round(-gain))} Min`,
          p.x, PLAYER_Y - 96, gain > 0 ? '#3ddc97' : '#ffd27a', 17);
      }
    }
  }
}

function updatePlay(dt) {
  const p = G.player;
  let mul = 1;
  if (p.boost > 0) { p.boost -= dt; mul *= 1.55; }
  if (p.slow > 0) { p.slow -= dt; mul *= 0.55; }
  if (p.stun > 0) { p.stun -= dt; mul *= 1 - 2 * Math.pow(Math.max(0, p.stun) / STUN, 1.3); }
  p.amp = lerp(p.amp, 1, Math.min(1, dt * 6));
  advance(G.v * mul, dt);
  const si = Math.floor(p.phase / Math.PI);
  if (si !== G.stepI) { G.stepI = si; sfx.step(); }
  G.timeLeft -= dt;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - dt * 4);
  while (G.events.length && G.s >= G.events[0].at) G.events.shift().fn();
  updateForks();
  if (G.lock !== null) p.lane = G.lock;
  if (p.stun <= 0) {
    for (const o of G.obstacles) {
      if (!collidable(o)) continue;
      const oy = screenY(o.d);
      if (oy < PLAYER_Y - 60 || oy > PLAYER_Y + 60) continue;
      if (overlaps(o, oy)) { hit(o, oy); break; }
    }
  }
  for (const o of G.obstacles) {
    if (o.passed || screenY(o.d) <= PLAYER_Y + 8) continue;
    o.passed = true;
    if (!collidable(o) || o.type === 'puddle' || p.stun > 0) continue;
    const hw = BOX[o.type][0];
    const gap = Math.abs(o.x - p.x) - hw - PHW;
    const dodged = G.time - p.changeT < 0.35 && Math.abs(o.x - LANES[p.prevLane]) < hw + PHW;
    if (gap < 16 || dodged) nearMiss();
  }
  for (const it of G.items) {
    if (it.taken) continue;
    const oy = screenY(it.d);
    if (Math.abs(oy - PLAYER_Y) < 26 && Math.abs(it.x - p.x) < 30) collect(it, oy);
  }
  if (G.s >= G.D) {
    G.s = G.D;
    if (G.wrongSide) beginWrong(); else beginBoard();
  } else if (G.timeLeft <= 0) { G.timeLeft = 0; beginMissed(); }
}

function beginBoard() {
  G.mode = 'board'; G.t = 0; G.confetti = false; G.sf = {};
  G.praise = G.timeLeft < 2 ? pick(PRAISE_TIGHT) : pick(PRAISE);
  G.player.stun = 0; G.player.boost = 0; G.player.slow = 0;
}

function updateBoard(dt) {
  const p = G.player;
  p.board = clamp(G.t / 0.45, 0, 1);
  p.phase += dt * 12;
  p.amp = 1 - p.board;
  if (G.t > 0.45 && !G.sf.beep) { G.sf.beep = true; sfx.beep(); }
  if (G.t > 0.5) G.doors = Math.max(0, 1 - (G.t - 0.5) / 0.3);
  if (G.t > 0.5 && !G.confetti) { G.confetti = true; burst('confetti', 180, PLAYER_Y - 70, 70); sfx.win(); }
  if (G.t > 0.95) {
    if (!G.sf.dep) { G.sf.dep = true; sfx.depart(); }
    G.trainV += 560 * dt; G.trainX += G.trainV * dt;
  }
  if (G.t > 2.7) goMap(G.legType === 'sev' ? 'bus' : 'train');
}

function beginWrong() {
  const p = G.player;
  G.mode = 'wrong'; G.t = 0;
  p.stun = 0; p.boost = 0;
  popText('Falsches Gleis!', 180, 300, '#ff5a5a', 30);
  sfx.fail();
  vibrate([40, 40, 40]);
}

function updateWrong(dt) {
  const p = G.player;
  p.amp = lerp(p.amp, 0, Math.min(1, dt * 6));
  G.timeLeft -= dt;
  if (G.timeLeft <= 0) { G.timeLeft = 0; G.fade = 0; return beginMissed(); }
  if (G.t > 1.1) G.fade = clamp((G.t - 1.1) / 0.25, 0, 1);
  if (G.t > 1.35) backtrack();
}

function backtrack() {
  G.backtracked = true; G.wrongSide = false; G.gleisFork = null;
  G.s = 0; G.D = 650 + 25 * G.legNo;
  G.obstacles = []; G.items = []; G.forks = []; G.noGen = []; G.events = []; G.lock = null;
  G.gen = { d: 300, free: [0, 1, 2], since: 2 };
  generate(G.D - 380);
  G.info.tafel = G.gleisTruth; G.train.gleis = G.gleisTruth; G.gleisFlapT = 0;
  G.trainX = 0; G.trainV = 0; G.doors = 1;
  G.mode = 'play'; G.t = 10;
  popText(`Zurück zu Gleis ${G.gleisTruth}!`, 180, 300, '#ffd400', 24);
}

function beginMissed() {
  G.mode = 'missed'; G.t = 0; G.missV = G.curV; G.sf = {};
  G.shake = 6;
  vibrate([30, 60, 30]);
  sfx.beep();
}

function updateMissed(dt) {
  const p = G.player;
  G.missV *= Math.max(0, 1 - dt * 2.8);
  p.amp = lerp(p.amp, 0, Math.min(1, dt * 3));
  let v = G.missV;
  if (G.s + v * dt > G.D - 40) v = Math.max(0, (G.D - 40 - G.s) / dt);
  advance(v, dt);
  G.doors = Math.max(0, 1 - G.t / 0.35);
  if (G.t > 0.4) {
    if (!G.sf.dep) { G.sf.dep = true; sfx.depart(); }
    G.trainV += 460 * dt; G.trainX += G.trainV * dt;
  }
  if (G.t > 2.0) resolveMissed();
}

function resolveMissed() {
  const J = G.J;
  if (G.legType === 'station') {
    J.delay += 15;
    if (J.delay > J.buffer) return gameOver();
    startLeg('sev');
  } else {
    J.delay += 30;
    if (J.delay > J.buffer) return gameOver();
    goMap('taxi');
  }
}

function update(dt) {
  G.time += dt; G.t += dt; G.curV = 0;
  const p = G.player;
  p.x += (LANES[p.lane] - p.x) * Math.min(1, dt * 16);
  p.lean = clamp((LANES[p.lane] - p.x) * 0.006, -0.35, 0.35);
  G.flapT += dt; G.gleisFlapT += dt;
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
  switch (G.mode) {
    case 'title': p.amp = 1; advance(110, dt); break;
    case 'jintro': if (G.t > 8) startLeg('station'); break;
    case 'intro':
      p.amp = lerp(p.amp, 0.15, Math.min(1, dt * 6));
      p.phase += dt * 4;
      if (G.t > 2.2) { G.mode = 'play'; G.t = 0; popText('Los!', 180, 300, '#ffd400', 46); }
      break;
    case 'play': updatePlay(dt); break;
    case 'board': updateBoard(dt); break;
    case 'wrong': updateWrong(dt); break;
    case 'missed': updateMissed(dt); break;
    case 'map': if (G.t > 2.9) afterMap(); break;
    case 'arrive': {
      const shown = G.t < 0.5 ? 0 : Math.min(G.J.stars, Math.floor((G.t - 0.5) / 0.3) + 1);
      if (shown > G.starsShown) {
        G.starsShown = shown;
        sfx.star();
        if (shown === G.J.stars) burst('confetti', 180, 360, 50);
      }
      break;
    }
  }
  if (!G.ann && G.annQ.length) { G.ann = G.annQ.shift(); sfx.gong(); }
  if (G.ann) { G.ann.t += dt; if (G.ann.t > G.ann.dur) G.ann = null; }
  if (G.app) { G.app.t += dt; if (G.app.t > G.app.dur) G.app = null; }
  for (const P of G.particles) {
    P.t += dt; P.x += P.vx * dt; P.y += P.vy * dt; P.rot += P.vr * dt;
    if (P.world) P.y += G.curV * dt;
    if (P.type === 'feather') { P.vy = Math.min(P.vy + 120 * dt, 50); P.vx *= 1 - dt * 2; P.x += Math.sin(P.t * 6) * 20 * dt; }
    else if (P.type === 'confetti') { P.vy += 520 * dt; P.vx *= 1 - dt * 1.2; }
    else if (P.type === 'drop') { P.vy += 700 * dt; }
    else { P.vx *= 1 - dt * 4.5; P.vy *= 1 - dt * 4.5; }
  }
  G.particles = G.particles.filter(P => P.t < P.life);
  for (const T of G.texts) T.t += dt;
  G.texts = G.texts.filter(T => T.t < T.dur);
  G.shake = Math.max(0, G.shake - dt * 30);
  G.flash = Math.max(0, G.flash - dt * 2);
}

// ---------- drawing: world ----------
const TH = () => THEMES[G.theme];
function eachWorld(spacing, offset, margin, fn) {
  const dMin = G.s + PLAYER_Y - H - margin, dMax = G.s + PLAYER_Y + margin;
  const k0 = Math.ceil((dMin - offset) / spacing), k1 = Math.floor((dMax - offset) / spacing);
  for (let k = k0; k <= k1; k++) fn(k, screenY(k * spacing + offset));
}
const worldOff = m => ((PLAYER_Y + G.s) % m + m) % m;

function drawFloor() {
  const th = TH(), T = th.tile;
  ctx.fillStyle = th.floor;
  ctx.fillRect(0, 0, W, H);
  const off = worldOff(T);
  if (th.alt !== th.floor) {
    ctx.fillStyle = th.alt;
    for (let y = off - T; y < H; y += T) {
      const k = Math.round((PLAYER_Y + G.s - y) / T);
      for (let c = 0; c * T < W; c++) if (((k + c) & 1) === 0) ctx.fillRect(c * T, y, T, T);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    for (let y = off - T; y < H; y += T) ctx.fillRect(0, y, W, 1);
    for (let c = 1; c * T < W; c++) ctx.fillRect(c * T, 0, 1, H);
  }
  if (th.walls === 'street') {
    // asphalt grain + dashed lane lines
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    const o3 = worldOff(37);
    for (let y = o3 - 37; y < H; y += 37) for (let x = 40; x < 330; x += 53) ctx.fillRect(x + ((y * 7) % 23), y, 2, 2);
    ctx.fillStyle = 'rgba(240,240,240,0.55)';
    const o2 = worldOff(56);
    for (let y = o2 - 56; y < H; y += 56) { ctx.fillRect(128, y, 4, 28); ctx.fillRect(228, y, 4, 28); }
  } else {
    ctx.fillStyle = 'rgba(210,215,228,0.14)';
    ctx.fillRect(125, 0, 10, H); ctx.fillRect(225, 0, 10, H);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    const o2 = worldOff(10);
    for (let y = o2 - 10; y < H; y += 10) { ctx.fillRect(125, y, 10, 3); ctx.fillRect(225, y, 10, 3); }
  }
}

function drawLights() {
  const th = TH();
  if (th.li <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const street = th.walls === 'street';
  eachWorld(street ? 220 : 260, 0, 120, (k, y) => {
    const cx = street ? (k & 1 ? 54 : 306) : 180;
    ctx.save();
    ctx.translate(cx, y);
    ctx.scale(1, street ? 0.7 : 0.45);
    const r = street ? 120 : 170;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, rgba(th.light, th.li));
    g.addColorStop(1, rgba(th.light, 0));
    ctx.fillStyle = g;
    ctx.fillRect(-r, -r, 2 * r, 2 * r);
    ctx.restore();
  });
  ctx.restore();
}

function drawWalls() {
  const th = TH();
  for (const side of [0, 1]) {
    const x0 = side ? W - WALL : 0;
    const inner = side ? x0 : x0 + WALL;
    if (th.walls === 'shops') {
      ctx.fillStyle = '#151923';
      ctx.fillRect(x0, 0, WALL, H);
      eachWorld(170, side * 85, 170, (k, y) => {
        const hk = hash(k * 7 + side * 3);
        const c = SHOPC[hk % SHOPC.length];
        const closed = th.dim && hk % 3 === 0;
        const f = th.dim ? 0.55 : 1;
        const gx = x0 + 4;
        if (closed) {
          ctx.fillStyle = '#0c0f15';
          ctx.fillRect(gx, y - 130, 22, 130);
          ctx.fillStyle = 'rgba(255,255,255,0.05)';
          for (let yy = y - 128; yy < y; yy += 6) ctx.fillRect(gx, yy, 22, 1);
          return;
        }
        const g = ctx.createLinearGradient(side ? x0 + WALL : x0, 0, side ? x0 : x0 + WALL, 0);
        g.addColorStop(0, rgba(c, 0.15 * f));
        g.addColorStop(1, rgba(c, 0.6 * f));
        ctx.fillStyle = g;
        ctx.fillRect(gx, y - 130, 22, 130);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(gx, y - 66, 22, 2);
        ctx.fillStyle = rgba(c, f);
        ctx.fillRect(gx - 1, y - 142, 24, 8);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g2 = ctx.createLinearGradient(inner, 0, side ? inner - 56 : inner + 56, 0);
        g2.addColorStop(0, rgba(c, 0.13 * f));
        g2.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g2;
        ctx.fillRect(side ? inner - 56 : inner, y - 130, 56, 130);
        ctx.restore();
      });
      ctx.fillStyle = '#323a4c';
    } else if (th.walls === 'tiles') {
      ctx.fillStyle = '#dfe3e8';
      ctx.fillRect(x0, 0, WALL, H);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      const o = worldOff(10);
      for (let y = o - 10; y < H; y += 10) ctx.fillRect(x0, y, WALL, 1);
      ctx.fillRect(x0 + 10, 0, 1, H); ctx.fillRect(x0 + 20, 0, 1, H);
      ctx.fillStyle = G.band;
      ctx.fillRect(side ? x0 + 4 : x0 + 20, 0, 6, H);
      ctx.fillStyle = '#9aa1ab';
    } else if (th.walls === 'brick') {
      ctx.fillStyle = '#7a3b2a';
      ctx.fillRect(x0, 0, WALL, H);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      const o = worldOff(16);
      for (let y = o - 16; y < H; y += 8) {
        ctx.fillRect(x0, y, WALL, 1);
        const row = Math.round((PLAYER_Y + G.s - y) / 8);
        for (let x = x0 + ((row & 1) ? 0 : 8); x < x0 + WALL; x += 16) ctx.fillRect(x, y, 1, 8);
      }
      eachWorld(240, side * 120, 60, (k, y) => {
        const bx = side ? x0 + 2 : x0 + 6;
        ctx.fillStyle = '#5a3a22';
        ctx.fillRect(bx, y - 8, 22, 10);
        ctx.fillStyle = '#3f8f3a';
        circle(bx + 5, y - 10, 5); circle(bx + 11, y - 12, 6); circle(bx + 17, y - 10, 5);
        ctx.fillStyle = hash(k + side) % 2 ? '#e63946' : '#ffd400';
        circle(bx + 6, y - 14, 2); circle(bx + 13, y - 17, 2); circle(bx + 18, y - 13, 2);
      });
      ctx.fillStyle = '#4a2a1e';
    } else {
      ctx.fillStyle = '#565c66';
      ctx.fillRect(x0, 0, WALL, H);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      const o = worldOff(24);
      for (let y = o - 24; y < H; y += 24) ctx.fillRect(x0, y, WALL, 1);
      eachWorld(220, side ? 0 : 110, 40, (k, y) => {
        const px = side ? x0 + 14 : x0 + 16;
        ctx.fillStyle = '#2b2f38';
        circle(px, y, 4);
        ctx.fillStyle = '#ffd9a0';
        circle(px, y, 2);
      });
      ctx.fillStyle = '#9aa0a8';
    }
    ctx.fillRect(side ? x0 : WALL - 3, 0, 3, H);
  }
}

function drawDoor(cx, top, bot, open) {
  const dw = 34, x = cx - dw / 2, y = top + 12, h = bot - y;
  ctx.fillStyle = '#9aa3ae';
  rrect(x - 2, y - 2, dw + 4, h + 2, 4); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, bot);
  g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#ffcf5a');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, dw, h);
  ctx.fillStyle = 'rgba(120,80,20,0.25)';
  ctx.fillRect(x + 4, y + 30, dw - 8, 10);
  const pw = (dw / 2) * (1 - open);
  if (pw > 0.5) {
    ctx.fillStyle = '#dfe4ea';
    ctx.fillRect(x, y, pw, h); ctx.fillRect(x + dw - pw, y, pw, h);
    ctx.fillStyle = '#1b2230';
    if (pw > 8) { ctx.fillRect(x + 3, y + 5, pw - 6, 22); ctx.fillRect(x + dw - pw + 3, y + 5, pw - 6, 22); }
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + pw - 1, y, 1, h); ctx.fillRect(x + dw - pw, y, 1, h);
  }
  ctx.fillStyle = open > 0.98 ? '#3ddc97' : '#ff4d4d';
  circle(cx, top + 6, 2.5);
}

function drawCar(x, top, bot, i, st) {
  const w = 340, h = bot - top;
  ctx.save();
  rrect2(x, top, w, h, i === -4 ? 34 : 8, i === 1 ? 46 : 8);
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, st.wrong ? '#e9ecef' : '#ffffff'); g.addColorStop(0.7, '#e7ebf0'); g.addColorStop(1, '#c4cbd4');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  ctx.fillRect(x, top, w, 8);
  ctx.fillStyle = '#1b2230';
  ctx.fillRect(x, top + 16, w, 26);
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  for (let k = 0; k < 9; k++) {
    const rx = x + k * 42 + 6;
    ctx.beginPath(); ctx.moveTo(rx, top + 42); ctx.lineTo(rx + 12, top + 16); ctx.lineTo(rx + 22, top + 16); ctx.lineTo(rx + 10, top + 42); ctx.fill();
  }
  ctx.fillStyle = '#d9dee5';
  for (let k = 1; k < 9; k++) ctx.fillRect(x + k * 38, top + 16, 3, 26);
  ctx.fillStyle = st.color;
  ctx.fillRect(x, top + 48, w, 6);
  if (i === 1) { ctx.fillStyle = '#ffe9a8'; circle(x + w - 10, bot - 14, 4); }
  if (i === -4) { ctx.fillStyle = '#ff3b30'; circle(x + 9, bot - 14, 3.5); }
  ctx.restore();
  for (const dx of [110, 210, 310]) if (!(i === 1 && dx === 310)) drawDoor(x + dx, top, bot, st.open);
  font('800', 10);
  text(st.label, x + 26, top + 70, st.color, 'left');
  if (st.dest) { font('700', 9); text('→ ' + st.dest, x + 128, top + 70, '#6b7280', 'left'); }
  ctx.fillStyle = '#2a2f3a';
  ctx.fillRect(x + 30, bot - 2, 60, 8); ctx.fillRect(x + w - 90, bot - 2, 60, 8);
}

function drawCars(top, bot, st) {
  const base = -30 + st.x;
  for (let i = -4; i <= 1; i++) {
    const cx = base + i * 350;
    if (cx > W || cx + 340 < 0) continue;
    drawCar(cx, top, bot, i, st);
  }
}

function drawBusSeg(x, top, bot, i) {
  const w = 340;

  ctx.fillStyle = '#f08c00';
  ctx.fillRect(x, top + 48, w, 8);

  }

  ctx.fillStyle = '#6b7280';

}

function drawTrainArea(y) {
  const sev = G.legType === 'sev';

      for (const [side, x0, x1] of [['L', -10, 180], ['R', 180, W + 10]]) {

        ctx.beginPath(); ctx.rect(x0, -50, x1 - x0, y + 60); ctx.clip();

    } else {

    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(0, y + 16, W, 3);
    ctx.fillStyle = 'rgba(255,212,0,0.6)'; ctx.fillRect(0, y + 24, W, 7);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let x = 2; x < W; x += 6) ctx.fillRect(x, y + 24, 2, 7);
  }
  if (G.doors > 0 && G.trainX < 1) {
    let lanes = LANES;
    if (G.gleisFork) lanes = [G.gleisFork.sides.L.gleis === G.gleisTruth ? LANES[0] : LANES[2]];

function drawForks() {

    g.addColorStop(0, '#4a5368'); g.addColorStop(0.5, '#3a4254'); g.addColorStop(1, '#2a3040');
    ctx.fillStyle = g;
    ctx.fillRect(x0, yt, x1 - x0, yb - yt);
    for (let d = f.d0 + 60; d < f.d0 + f.len - 40; d += 120) {

    }

    ctx.fillStyle = '#ffd400'; ctx.fillRect(x0, yb - 16, x1 - x0, 16);
    ctx.fillStyle = '#111';
    for (let x = x0 - 20; x < x1; x += 16) { ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x + 8, yb); ctx.lineTo(x + 24, yb - 16); ctx.lineTo(x + 16, yb - 16); ctx.fill(); }
    ctx.restore();
    if (f.kind === 'bakery') {

      ctx.fillRect(left ? WALL : W - WALL - 70, yt2, 70, yb - yt2);
      ctx.restore();
      ctx.save();
      ctx.translate(wx + 15, (yt2 + yb) / 2);
      ctx.rotate(left ? -Math.PI / 2 : Math.PI / 2);
      font('900', 12);
      text('BACKSTUBE', 0, 0, '#5a3410', 'center', 'middle');

  }
}

function drawPlayer() {
  const p = G.player;
  const run = Math.sin(p.phase) * p.amp;
  const bob = Math.abs(Math.cos(p.phase)) * 3 * p.amp;
  const y = PLAYER_Y - p.board * 46;
  const sc = 1 - p.board * 0.35;
  const alpha = 1 - clamp((p.board - 0.55) / 0.45, 0, 1);
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (p.boost > 0 && G.mode === 'play') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(p.x, y - 8, 0, p.x, y - 8, 44);
    g.addColorStop(0, 'rgba(255,200,90,0.35)'); g.addColorStop(1, 'rgba(255,200,90,0)');
    ctx.fillStyle = g; ctx.fillRect(p.x - 44, y - 52, 88, 88);
    ctx.restore();
    drawRunner(p.x, y + 26, run, bob, sc, p.lean, true);
    drawRunner(p.x, y + 13, run, bob, sc, p.lean, true);
  }
  if (p.stun > 0 && Math.floor(G.time * 14) % 2 === 0) ctx.globalAlpha *= 0.55;
  drawRunner(p.x, y, run, bob, sc, p.lean, false);
  ctx.restore();
  if (p.stun > 0) {
    for (let i = 0; i < 3; i++) {
      const a = G.time * 7 + i * 2.09;
      drawStar(p.x + Math.cos(a) * 15, y - 44 + Math.sin(a) * 5, 4.5, '#ffd400');
    }
  }
  if (G.mode === 'wrong' || (G.mode === 'missed' && G.t > 0.8)) {
    font('800', 18);
    text(G.mode === 'wrong' ? '?!' : '…', p.x + 14, y - 40, 'rgba(255,255,255,0.85)', 'left');
  }
}

function drawPuddles() {
  for (const o of G.obstacles) {
    if (o.type !== 'puddle') continue;
    const y = screenY(o.d);
    if (y > -30 && y < H + 30) drawPuddle(o, o.x, y);
  }
}

function drawEntities() {
  const list = [];
  for (const o of G.obstacles) {
    if (o.type === 'puddle') continue;
    const y = screenY(o.d);
    if (y > -140 && y < H + 140) list.push([y, o]);
  }
  for (const it of G.items) {
    const y = screenY(it.d);
    if (y > -60 && y < H + 60) list.push([y, it]);
  }
  list.push([PLAYER_Y + 0.5 - G.player.board * 46, null]);
  list.sort((a, b) => a[0] - b[0]);
  for (const [y, o] of list) {
    if (!o) { drawPlayer(); continue; }
    switch (o.type) {
      case 'pillar': drawPillar(o, o.x, y); break;
      case 'barrier': drawBarrier(o, o.x, y); break;
      case 'pigeons': drawPigeons(o, o.x, y); break;
      case 'suitcase': drawSuitcase(o, o.x, y); break;
      case 'group': drawGroup(o, o.x + Math.sin(G.time * 2 + o.t) * 3, y); break;
      case 'scooter': drawScooter(o, o.x, y); break;
      case 'taxi': drawTaxi(o, o.x, y); break;
      case 'coffee': drawCoffee(o, o.x, y); break;
    }
  }
}

function drawParticles() {
  for (const P of G.particles) {
    const k = 1 - P.t / P.life;
    if (P.type === 'dust') {
      ctx.fillStyle = `rgba(220,225,235,${0.5 * k})`;
      circle(P.x, P.y, P.size * (1 + P.t * 2));
    } else if (P.type === 'feather') {
      ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.rot);
      ctx.fillStyle = `rgba(232,235,242,${k})`;
      ctx.beginPath(); ctx.ellipse(0, 0, P.size, P.size * 0.42, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(120,128,140,${k})`; ctx.lineWidth = 0.8;
      line(-P.size, 0, P.size, 0);
      ctx.restore();
    } else if (P.type === 'confetti') {
      ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.rot); ctx.scale(Math.cos(P.t * 9 + P.rot), 1);
      ctx.globalAlpha = Math.min(1, k * 2);
      ctx.fillStyle = P.color;
      ctx.fillRect(-P.size / 2, -P.size / 4, P.size, P.size / 2);
      ctx.restore();
    } else if (P.type === 'spark') {
      ctx.strokeStyle = `rgba(255,210,122,${k})`; ctx.lineWidth = P.size;
      line(P.x, P.y, P.x - P.vx * 0.05, P.y - P.vy * 0.05);
    } else if (P.type === 'drop') {
      ctx.fillStyle = `rgba(170,205,245,${k})`;
      circle(P.x, P.y, P.size);
    }
  }
}

// ---------- overhead signs ----------
const PAR = 1.3, SIGN_SP = 1150, SIGN_OFF = 650;
function signVisible(d) {
  if (G.mode === 'title') return true;
  if (d > G.D - 450) return false;
  for (const f of G.forks) if (d > f.d0 - 500 && d < f.d0 + f.len) return false;
  return true;
}
function eachSign(fn) {
  if (TH().nosigns || G.mode === 'title') return;
  const dMin = G.s + (PLAYER_Y - H - 60) / PAR, dMax = G.s + (PLAYER_Y + 80) / PAR;
  for (let k = Math.ceil((dMin - SIGN_OFF) / SIGN_SP); k <= Math.floor((dMax - SIGN_OFF) / SIGN_SP); k++) {
    const d = k * SIGN_SP + SIGN_OFF;
    if (signVisible(d)) fn(k, d, PLAYER_Y - (d - G.s) * PAR);
  }
}
function drawSignShadows() {
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  eachSign((k, d) => { rrect(44, screenY(d) + 26, 272, 14, 7); ctx.fill(); });
  for (const f of G.forks) {
    const d = f.d0 - 110, y = screenY(d);

  }
}

function drawClock(cx, cy, r) {
  const now = new Date();
  const ms = now.getSeconds() * 1000 + now.getMilliseconds();
  const sec = (Math.min(ms / 58500, 1)) * TAU;
  const min = (now.getMinutes() / 60) * TAU;
  const hr = (((now.getHours() % 12) + now.getMinutes() / 60) / 12) * TAU;
  ctx.fillStyle = '#4a5160';
  ctx.fillRect(cx - 3, cy - r - 34, 6, 30);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#2b2f38';
  circle(cx, cy, r + 5);
  ctx.restore();
  ctx.fillStyle = '#fbfbf8';
  circle(cx, cy, r);
  ctx.fillStyle = '#111';
  for (let i = 0; i < 60; i++) {
    const big = i % 5 === 0;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate((i / 60) * TAU);
    ctx.fillRect(big ? -1.8 : -0.6, -r + 3, big ? 3.6 : 1.2, big ? 10 : 4);
    ctx.restore();
  }
  const hand = (ang, w, len, tail, col) => {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.fillStyle = col; ctx.fillRect(-w / 2, -len, w, len + tail);
    ctx.restore();
  };
  hand(hr, 5.5, r * 0.55, r * 0.15, '#111');
  hand(min, 4, r * 0.82, r * 0.18, '#111');
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(sec);
  ctx.fillStyle = '#e2231a';
  ctx.fillRect(-0.9, -r * 0.62, 1.8, r * 0.9);
  circle(0, -r * 0.62, r * 0.13);
  ctx.restore();
  ctx.fillStyle = '#e2231a';
  circle(cx, cy, 2);
}

  const sy = 120 + Math.sin(t * 2) * 2;
  ctx.strokeStyle = '#5b6474'; ctx.lineWidth = 3;
  line(90, 0, 90, sy - 40); line(270, 0, 270, sy - 40);
  blueCard(34, sy - 44, 292, 92, 14);
  font('900', 42);
  text('Anschluss!', 180, sy + 2, '#fff', 'center', 'middle');
  ctx.fillStyle = '#ffd400';
  rrect(130, sy + 22, 100, 4, 2); ctx.fill();
  font('600', 13);
  text('Komm pünktlich an. Irgendwie.', 180, sy + 38, 'rgba(255,255,255,0.85)', 'center', 'middle');
  drawClock(180, 240, 40);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  rrect(26, 312, 146, 38, 19); ctx.fill();
  rrect(188, 312, 146, 38, 19); ctx.fill();
  font('700', 13);
  text('◀  links tippen', 99, 331.5, '#fff', 'center', 'middle');
  text('rechts tippen  ▶', 261, 331.5, '#fff', 'center', 'middle');
  font('600', 12);
  text('Ausweichen · Gabelungen wählen · Zug erwischen', 180, 368, 'rgba(255,255,255,0.7)', 'center', 'middle');
  font('700', 13);
  text(best > 0 ? `Rekord: ${best} ⭐` : 'Noch kein Rekord. Zeit wird’s.', 180, 392, '#fff', 'center', 'middle');
  ctx.globalAlpha = blink(t);
  font('900', 21);
  outlined('Tippen zum Starten', 180, 422, '#ffd400', 5);
  ctx.globalAlpha = 1;
}

function drawIntro() {
  const t = G.t;
  const a = t < 0.25 ? ease(t / 0.25) : t > 1.85 ? 1 - ease(clamp((t - 1.85) / 0.35, 0, 1)) : 1;
  const sev = G.legType === 'sev';
  const J = G.J;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = 'rgba(5,8,18,0.45)';
  ctx.fillRect(0, HUD_H, W, H - HUD_H);
  ctx.translate(180, 290);
  ctx.scale(0.92 + 0.08 * a, 0.92 + 0.08 * a);
  if (sev) blueCard(-155, -92, 310, 190, 14, '#a85c00', '#6b3a00');
  else blueCard(-155, -92, 310, 190, 14);
  const tr = G.train, ft = G.flapT;
  font('700', 10);
  const head = sev ? 'SCHIENENERSATZVERKEHR  ·  +15 MIN'
    : `UMSTIEG ${J.leg + 1}/${J.n}  ·  ${J.route[J.leg].toUpperCase()} HBF`;
  text(head, 0, -70, 'rgba(255,255,255,0.7)', 'center', 'middle');
  if (!sev) {
    font('600', 10);
    text(THEME_NAMES[G.theme] || '', 0, -56, 'rgba(255,255,255,0.45)', 'center', 'middle');
  }
  const badge = tr.badge || tr.name;
  font('800', 12);
  const bw = ctx.measureText(badge).width + 12;
  font('800', 19);
  const dest = ellipsize(tr.dest, 270 - bw - 8);
  const dw = ctx.measureText(dest).width;
  const x0 = -(bw + 8 + dw) / 2;
  ctx.fillStyle = sev ? '#f08c00' : tr.color;
  rrect(x0, -40, bw, 20, 5); ctx.fill();
  font('800', 12);
  text(flap(badge, ft, 0), x0 + 6, -29.5, '#fff', 'left', 'middle');
  font('800', 19);
  text(flap(dest, ft, 0.1), x0 + bw + 8, -29.5, '#fff', 'left', 'middle');
  font('600', 14);
  text(sev ? `Haltestelle vor dem Bahnhof  ·  ab ${tr.planned}`
    : `Gleis ${flap(String(tr.gleis), ft, 0.3)}  ·  ab ${flap(tr.planned, ft, 0.3)}`, 0, 0, 'rgba(255,255,255,0.85)', 'center', 'middle');
  font('900', 34);
  text(`in ${G.timeTotal} Min`, 0, 40, '#ffd400', 'center', 'middle');
  font('600', 11);
  wrap('Tipp: ' + G.tip, 280, 2).forEach((l, i) => text(l, 0, 70 + i * 14, 'rgba(255,255,255,0.72)', 'center', 'middle'));
  ctx.restore();
}

function drawTapHint() {
  if (G.mode !== 'play' || G.legNo !== 0 || G.t > 3) return;
  const a = G.t < 2.4 ? 1 : 1 - (G.t - 2.4) / 0.6;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1) * 0.9;
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fillRect(0, HUD_H, 178, H - HUD_H);
  ctx.fillRect(182, HUD_H, 178, H - HUD_H);
  font('800', 15);
  outlined('◀ tippen', 90, 535, '#fff', 4);
  outlined('tippen ▶', 270, 535, '#fff', 4);
  ctx.restore();
}

function drawCleared() {
  const t = G.t - 0.45;
  if (t < 0) return;
  const s = t < 0.25 ? ease(t / 0.25) * 1.12 : 1.12 - 0.12 * Math.min(1, (t - 0.25) / 0.15);
  const a = G.t > 2.35 ? Math.max(0, 1 - (G.t - 2.35) / 0.3) : 1;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(180, 250);
  ctx.scale(s, s);
  font('900', 29);
  outlined(G.legType === 'sev' ? 'Bus erwischt!' : 'Anschluss erwischt!', 0, 0, '#fff', 7);
  font('800', 16);
  outlined(G.praise, 0, 32, '#ffd400', 5);
  font('700', 13);
  outlined(`Puffer ${Math.max(0, Math.floor(G.timeLeft))} Min`, 0, 58, '#fff', 4);
  ctx.restore();
}

function drawMissed() {
  const t = G.t - 0.2;
  if (t < 0) return;
  const s = t < 0.2 ? ease(t / 0.2) * 1.15 : 1.15 - 0.15 * Math.min(1, (t - 0.2) / 0.15);
  ctx.save();
  ctx.translate(180, 250);
  ctx.scale(s, s);
  font('900', 40);
  outlined(G.legType === 'sev' ? 'Bus weg.' : 'Zug weg.', 0, 0, '#ff5a5a', 8);
  if (G.t > 0.7) {
    font('800', 15);
    outlined(G.legType === 'sev' ? 'Dann eben Taxi. +30 Min' : 'Schienenersatzverkehr! +15 Min', 0, 38, '#ffd400', 5);
  }
  ctx.restore();
}

// ---------- map scenes ----------
const mp = c => [67 + (c[0] - 5.7) * 23.6, 100 + (55.2 - c[1]) * 37.5];
function vehicleIcon(x, y, mode) {
  const col = mode === 'bus' ? '#f08c00' : mode === 'taxi' ? '#f5e27a' : '#ffffff';
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8;
  ctx.fillStyle = col;
  rrect(x - 11, y - 8, 22, 16, 5); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#0b2a6b';
  ctx.fillRect(x - 7, y - 5, 5, 5); ctx.fillRect(x + 2, y - 5, 5, 5);
  ctx.fillStyle = '#111';
  circle(x - 5, y + 8, 2); circle(x + 5, y + 8, 2);
}
function segStyle(mode) {
  if (mode === 'bus') { ctx.strokeStyle = '#f08c00'; ctx.setLineDash([6, 5]); }
  else if (mode === 'taxi') { ctx.strokeStyle = '#f5e27a'; ctx.setLineDash([2, 4]); }
  else { ctx.strokeStyle = '#ffd400'; ctx.setLineDash([]); }
  ctx.lineWidth = 3;
}
function drawMapScene() {
  const J = G.J, t = G.t;
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#071330'); bg.addColorStop(1, '#0a1f4f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  font('700', 10);
  text(`REISE ${G.run.journeys + (G.mode === 'arrive' ? 0 : 1)}  ·  ${J.occ.name.toUpperCase()}`, 180, 22, 'rgba(255,255,255,0.6)', 'center', 'middle');
  font('900', 20);
  text(ellipsize(`${J.route[0]} → ${J.route[J.n]}`, 330), 180, 46, '#fff', 'center', 'middle');
  font('600', 12);
  text(`Termin ${clockStr(J.termin)} Uhr  ·  Ankunft geplant ${clockStr(J.arrival)}`, 180, 70, 'rgba(255,255,255,0.75)', 'center', 'middle');
  // country
  ctx.save();
  ctx.shadowColor = 'rgba(60,120,255,0.45)'; ctx.shadowBlur = 14;
  ctx.beginPath();
  OUTLINE.forEach((c, i) => { const [x, y] = mp(c); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.fillStyle = '#10306e'; ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#3567d0'; ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (const c of CN) { const [x, y] = mp(CITIES[c]); circle(x, y, 1.6); }
  // route
  const anim = G.mode === 'map';
  const q = anim ? ease(clamp((t - 0.25) / 1.6, 0, 1)) : 1;
  let head = null;
  ctx.lineCap = 'round';
  for (let j = 0; j < J.n; j++) {
    const [x1, y1] = mp(CITIES[J.route[j]]), [x2, y2] = mp(CITIES[J.route[j + 1]]);
    if (anim && j === J.leg) {
      segStyle(J.segs[j]);
      const hx = lerp(x1, x2, q), hy = lerp(y1, y2, q);
      line(x1, y1, hx, hy);
      head = [hx, hy, J.segs[j]];
    } else if (j < J.segs.length) {
      segStyle(J.segs[j]);
      line(x1, y1, x2, y2);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([3, 5]);
      line(x1, y1, x2, y2);
    }
  }
  ctx.setLineDash([]);
  J.route.forEach((c, i) => {
    const [x, y] = mp(CITIES[c]);
    const done = i <= J.leg;
    ctx.fillStyle = done ? '#ffd400' : '#fff';
    circle(x, y, i === 0 || i === J.n ? 5 : 4);
    ctx.fillStyle = '#0a1f4f';
    circle(x, y, i === 0 || i === J.n ? 2.2 : 1.6);
    if (!(i === 0 || i === J.n || i === J.leg || i === J.leg + 1)) return;
    font(i === J.n ? '800' : '600', i === J.n ? 11 : 10);
    const right = x < 230;
    text(c, x + (right ? 8 : -8), y + 1, i === J.n ? '#fff' : 'rgba(255,255,255,0.8)', right ? 'left' : 'right', 'middle');
  });
  if (head) vehicleIcon(head[0], head[1], head[2]);
  else if (G.mode !== 'arrive') {
    const [x, y] = mp(CITIES[J.route[Math.min(J.leg, J.n)]]);
    const r = 8 + 5 * ((G.time * 1.2) % 1);
    ctx.strokeStyle = `rgba(255,212,0,${1 - ((G.time * 1.2) % 1)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  }
  if (G.mode === 'map' || G.mode === 'jintro') drawMapFooter();
}

function drawMapFooter() {
  const J = G.J, t = G.t;
  let y = 432;
  if (G.mode === 'map') {
    const mode = J.segs[J.leg];
    const next = J.route[J.leg + 1];
    font('800', 15);
    const cap = mode === 'bus' ? `🚌 Schienenersatzverkehr → ${next}` : mode === 'taxi' ? `🚕 Taxi → ${next}  (+30 Min)` : `🚆 ${G.train.name} → ${next}`;
    text(ellipsize(cap, 330), 180, y, '#fff', 'center', 'middle');
    y += 24;
    font('600', 12);
    text(J.leg + 1 < J.n ? `Nächster Umstieg: ${next} Hbf` : `Gleich: Ankunft in ${next}`, 180, y, 'rgba(255,255,255,0.7)', 'center', 'middle');
  } else {
    font('800', 15);
    text(`${J.n} Umstiege  ·  Start ${clockStr(J.startClock)} in ${J.route[0]}`, 180, y, '#fff', 'center', 'middle');
    y += 24;
    font('600', 12);
    text(`Termin: ${J.occ.name}`, 180, y, 'rgba(255,255,255,0.75)', 'center', 'middle');
  }
  y += 22;
  font('700', 12);
  const late = J.delay > 0;
  text(`Verspätung: ${late ? '+' + J.delay + ' Min' : 'keine'}  ·  Puffer: ${J.buffer} Min`, 180, y,
    J.delay > J.buffer * 0.66 ? '#ff9a9a' : late ? '#ffd400' : '#3ddc97', 'center', 'middle');
  if (t > 0.6) {
    ctx.globalAlpha = blink(G.time);
    font('900', 16);
    text(G.mode === 'map' ? 'Tippen zum Weiterfahren' : 'Tippen zum Losfahren', 180, 528, '#ffd400', 'center', 'middle');
    ctx.globalAlpha = 1;
  }
}

function drawStarRow(cx, y, n, shown, r) {
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * (r * 2.6);
    if (i < shown) {
      const age = G.t - 0.5 - i * 0.3;
      const s = age < 0.2 ? ease(clamp(age / 0.2, 0, 1)) * 1.3 : 1.3 - 0.3 * Math.min(1, (age - 0.2) / 0.15);
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      drawStar(0, 0, r, '#ffd400');
      ctx.restore();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      starPath(x, y, r); ctx.stroke();
    }
  }
}

function drawArrive() {
  const J = G.J, t = G.t, a = ease(Math.min(1, t / 0.35));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(180, 440 + (1 - a) * 30);
  blueCard(-162, -122, 324, 232, 16);
  font('900', 21);
  text(ellipsize(`Angekommen in ${J.route[J.n]}!`, 300), 0, -96, '#fff', 'center', 'middle');
  drawStarRow(0, -58, J.stars, G.starsShown, 16);
  font('800', 15);
  text(J.delay <= 0 ? 'Pünktlich!' : `+${J.delay} Min Verspätung`, 0, -24, J.delay <= 0 ? '#3ddc97' : '#ffd400', 'center', 'middle');
  font('500', 12);
  wrap(J.occ.ok, 290, 2).forEach((l, i) => text(l, 0, 0 + i * 16, 'rgba(255,255,255,0.85)', 'center', 'middle'));
  font('700', 12);
  text(`⭐ ${G.run.stars} gesamt  ·  Rekord ${best}${G.newBest ? '  ·  Neu!' : ''}`, 0, 44, '#fff', 'center', 'middle');
  if (t > 1.6) {
    ctx.globalAlpha = a * blink(G.time);
    font('900', 17);
    text('Nächste Reise? Tippen.', 0, 80, '#ffd400', 'center', 'middle');
  }
  ctx.restore();
}

function drawOver() {
  const J = G.J, t = G.t, a = ease(Math.min(1, t / 0.35));
  ctx.fillStyle = `rgba(5,8,18,${0.35 * a})`;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(180, 420 + (1 - a) * 30);
  blueCard(-162, -140, 324, 270, 16, '#6b1f2a', '#3d0f17');
  font('900', 28);
  text('Termin verpasst.', 0, -110, '#fff', 'center', 'middle');
  font('700', 12);
  text(`${J.occ.name}, ${clockStr(J.termin)} Uhr in ${J.route[J.n]}`, 0, -84, 'rgba(255,255,255,0.7)', 'center', 'middle');
  font('500', 13);
  wrap(J.occ.fail, 280, 2).forEach((l, i) => text(l, 0, -60 + i * 17, 'rgba(255,255,255,0.88)', 'center', 'middle'));
  font('700', 11);
  text(`REISEN GESCHAFFT: ${G.run.journeys}`, 0, -22, 'rgba(255,255,255,0.65)', 'center', 'middle');
  font('900', 46);
  text(`⭐ ${G.run.stars}`, 0, 16, '#ffd400', 'center', 'middle');
  if (G.newBest && G.run.stars > 0) {
    ctx.save();
    ctx.translate(0, 58);
    ctx.rotate(Math.sin(G.time * 3) * 0.04);
    ctx.fillStyle = '#ffd400';
    rrect(-78, -14, 156, 28, 14); ctx.fill();
    font('900', 14);
    text('NEUER REKORD!', 0, 1, '#3d0f17', 'center', 'middle');
    ctx.restore();
  } else {
    font('700', 14);
    text(`Rekord: ${best} ⭐`, 0, 58, '#fff', 'center', 'middle');
  }
  if (t > 0.9) {
    ctx.globalAlpha = a * blink(G.time);
    font('900', 18);
    text('Nochmal? Tippen.', 0, 100, '#ffd400', 'center', 'middle');
  }
  ctx.restore();
}

function drawTexts() {
  for (const T of G.texts) {
    const k = T.t / T.dur;
    const s = T.t < 0.12 ? ease(T.t / 0.12) * 1.25 : 1.25 - 0.25 * Math.min(1, (T.t - 0.12) / 0.12);
    const a = k > 0.65 ? 1 - (k - 0.65) / 0.35 : 1;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(T.x, T.y - T.t * 28);
    ctx.scale(s, s);
    font('900', T.size);
    outlined(T.str, 0, 0, T.col, Math.max(5, T.size / 5));
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (['jintro', 'map', 'arrive', 'over'].includes(G.mode)) {
    drawMapScene();
    if (G.mode === 'arrive') drawArrive();
    if (G.mode === 'over') drawOver();
    drawParticles();
    drawTexts();
    drawSoundBtn();
    return;
  }
  const th = TH();
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  drawFloor();
  drawLights();
  drawWalls();
  const doorY = screenY(G.D);
  if (G.mode !== 'title' && doorY > -20) drawTrainArea(doorY);
  drawPuddles();
  drawForks();
  drawSignShadows();
  drawEntities();
  drawParticles();
  drawOverhead();
  if (th.rain) drawRain();
  if (G.player.boost > 0 && G.mode === 'play') {
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) {
      const x = 34 + Math.random() * 292, y = HUD_H + Math.random() * (H - HUD_H);
      line(x, y, x, y + 30 + Math.random() * 50);
    }
  }
  ctx.restore();
  if (th.tint) { ctx.fillStyle = th.tint; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(180, 300, 170, 180, 300, 430);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, `rgba(0,0,0,${th.vign})`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  if (G.slowmo > 0) {
    const g = ctx.createRadialGradient(180, 300, 150, 180, 300, 420);
    g.addColorStop(0, 'rgba(150,210,255,0)'); g.addColorStop(1, `rgba(150,210,255,${0.6 * G.slowmo})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (G.mode === 'play' && G.timeLeft < 4.5) {
    const a = 0.22 + 0.16 * Math.sin(G.time * 12);
    const g = ctx.createRadialGradient(180, 300, 200, 180, 300, 420);
    g.addColorStop(0, 'rgba(255,40,40,0)'); g.addColorStop(1, `rgba(255,40,40,${a})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,70,70,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawTapHint();
  drawTexts();
  if (G.mode === 'title') { drawTitle(); drawSoundBtn(); return; }
  drawApp();
  drawPill();
  drawBanner();
  drawHUD();
  drawSoundBtn();
  if (G.mode === 'intro') drawIntro();
  else if (G.mode === 'board') drawCleared();
  else if (G.mode === 'missed') drawMissed();
  if (G.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${G.fade})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- input & loop ----------
function onTap(side) {
  switch (G.mode) {
    case 'title': if (G.t > 0.25) newRun(); return;
    case 'jintro': if (G.t > 0.6) startLeg('station'); return;
    case 'map': if (G.t > 0.5) afterMap(); return;
    case 'arrive': if (G.t > 1.6) newJourney(); return;
    case 'over': if (G.t > 0.9) newRun(); return;
  }
  if ((G.mode === 'play' || G.mode === 'intro') && side && G.lock === null) {
    const p = G.player;
    const nl = clamp(p.lane + side, 0, 2);
    if (nl !== p.lane) { p.prevLane = p.lane; p.changeT = G.time; p.lane = nl; }
  }
}
function onPointer(x, y) {
  const [bx, by] = soundBtnPos();
  if (Math.hypot(x - bx, y - by) < 22) { setSound(!SND.on); sfx.click(); return; }
  if (SND.on) sndInit();
  onTap(x < W / 2 ? -1 : 1);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  onPointer(((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H);
}, { passive: false });
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => {
  if (SND.on) sndInit();
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { onTap(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { onTap(1); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'Enter') { onTap(0); e.preventDefault(); }
  else if (e.key === 'm' || e.key === 'M') setSound(!SND.on);
});

let last = performance.now();
function frame(now) {
  const real = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  if (!G.paused && real > 0) {
    const dt = G.slowmo > 0 ? real * 0.3 : real;
    G.slowmo = Math.max(0, G.slowmo - real);
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__anschluss = { G, update, render, newRun, startLeg, tap: onTap, setSeed: n => { seed = n >>> 0; },
  screenY, collidable, BOX, LANES, PLAYER_Y, makeRoute };
})();
</script>
</body>
